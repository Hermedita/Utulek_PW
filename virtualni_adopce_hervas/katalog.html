<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katalog zvířat | HERVAS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
  <header class="header">
    <a href="index.html" class="brand">
      <div class="brand-mark">HERVAS</div>
      <div><div class="brand-sub">ADOPCE A VIRTUÁLNÍ PÉČE O ZVÍŘATA</div></div>
    </a>
    <div class="top-links" id="topAuthLinks"></div>
    <nav class="nav">
      <a href="index.html">ÚVOD</a>
      <a href="katalog.html" class="selected">KATALOG ZVÍŘAT</a>
      <a href="adopce.html">JAK ADOPTOVAT</a>
      <a href="pomoc.html">CHCI POMOCI</a>
      <a href="profil.html" id="navProfilLink" class="hidden">MŮJ PROFIL</a>
      <a href="auth.html" id="navAuthLink">PŘIHLÁŠENÍ / REGISTRACE</a>
    </nav>
  </header>

  <main class="page-section">
    <div class="section-heading">
      <span class="eyebrow">NAJDI SVÉHO PARŤÁKA NEBO CHRÁNĚNCE</span>
      <h1>Katalog zvířat k adopci</h1>
      <p>Využijte filtr pro vyhledání podle druhu a pohlaví.</p>
    </div>

    <div class="filter-box">
      <div class="filter-group">
        <label>Druh:</label>
        <select id="filterType" onchange="applyFilters()">
          <option value="all">Všechny druhy</option>
          <option value="Pes">Psi</option>
          <option value="Kočka">Kočky</option>
          <option value="Ostatní">Ostatní</option>
        </select>
      </div>
      <div class="filter-group">
        <label>Pohlaví:</label>
        <select id="filterGender" onchange="applyFilters()">
          <option value="all">Všechna pohlaví</option>
          <option value="Samec">Samec</option>
          <option value="Samice">Samice</option>
          <option value="Jiné">Jiné</option>
        </select>
      </div>
      <button class="reset-btn" onclick="resetFilters()">RESETOVAT FILTR</button>
    </div>

    <div class="animal-grid" id="animalGrid"></div>
    <div class="pagination" id="paginationControls"></div>
  </main>

  <footer class="footer">
    <div class="footer-content"><div><strong>HERVAS ADOPČNÍ SYSTÉM</strong></div></div>
  </footer>
</div>
<script src="script.js"></script>
</body>
</html>
