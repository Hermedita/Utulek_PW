<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Přihlášení a registrace | HERVAS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
  <header class="header">
    <a href="index.html" class="brand">
      <div class="brand-mark">HERVAS</div>
      <div><div class="brand-sub">ADOPCE A VIRTUÁLNÍ PÉČE O ZVÍŘATA</div></div>
    </a>
    <div class="top-links" id="topAuthLinks"></div>
    <nav class="nav">
      <a href="index.html">ÚVOD</a>
      <a href="katalog.html">KATALOG ZVÍŘAT</a>
      <a href="adopce.html">JAK ADOPTOVAT</a>
      <a href="pomoc.html">CHCI POMOCI</a>
      <a href="profil.html" id="navProfilLink" class="hidden">MŮJ PROFIL</a>
      <a href="auth.html" id="navAuthLink" class="selected">PŘIHLÁŠENÍ / REGISTRACE</a>
    </nav>
  </header>

  <main class="page-section">
    <div class="auth-container">
      <div class="auth-box">
        <h2>PŘIHLÁŠENÍ</h2>
        <form onsubmit="handleLogin(event)">
          <input type="email" id="loginEmail" placeholder="E-mail" required>
          <input type="password" id="loginPassword" placeholder="Heslo" required>
          <button type="submit">PŘIHLÁSIT SE</button>
        </form>
        <div style="margin-top: 20px; font-size: 13px; background: #eee; padding: 12px; border-left: 4px solid #555;">
          <strong>TESTOVACÍ ÚČTY PRO OVĚŘENÍ:</strong><br>
          • Admin: <code>admin@hervas.cz</code><br>
          • Manažer: <code>manager@hervas.cz</code><br>
          • Uživatel: <code>jan@example.com</code>
        </div>
      </div>

      <div class="auth-box">
        <h2>NOVÁ REGISTRACE</h2>
        <form onsubmit="handleRegister(event)">
          <input type="text" id="regName" placeholder="Jméno a příjmení" required>
          <input type="email" id="regEmail" placeholder="E-mail" required>
          <input type="password" id="regPassword" placeholder="Heslo" required>
          <input type="password" id="regPasswordConfirm" placeholder="Heslo znovu" required>
          <button type="submit">REGISTROVAT SE</button>
        </form>
      </div>
    </div>
  </main>

  <footer class="footer"><div class="footer-content"><div><strong>HERVAS</strong></div></div></footer>
</div>
<script src="script.js"></script>
</body>
</html>
